<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>圖示預覽</title><style>
body{margin:0;padding:28px 18px;font:15px/1.6 -apple-system,"Noto Sans TC",sans-serif;
 background:#eceae6;color:#1a1f26}
h1{font-size:17px;margin:0 0 18px}
.row{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.i{text-align:center}
.i img{display:block;border-radius:22.5%;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.i span{font-size:11px;color:#6b7480;display:block;margin-top:6px}
.wall{background:#2b3440 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"/>');
 padding:20px;border-radius:14px;display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.wall .i span{color:#c8ced6}
.n{font-size:12px;color:#5b6husb}
</style></head><body>
<h1>圖示預覽 — 依實際尺寸</h1>
<div class="row">
 <div class="i"><img src="icons/icon-180.png" width="120" height="120"><span>120pt</span></div>
 <div class="i"><img src="icons/icon-180.png" width="60" height="60"><span>60pt(主畫面實際大小)</span></div>
 <div class="i"><img src="icons/icon-180.png" width="40" height="40"><span>40pt</span></div>
 <div class="i"><img src="icons/icon-180.png" width="29" height="29"><span>29pt(設定列表)</span></div>
</div>
<div class="wall">
 <div class="i"><img src="icons/icon-180.png" width="60" height="60"><span>停哪裡</span></div>
 <div class="i"><img src="icons/maskable-512.png" width="60" height="60" style="border-radius:50%"><span>圓形裁切</span></div>
</div>
</body></html>
