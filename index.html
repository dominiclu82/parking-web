<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>停哪裡</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5cab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="停哪裡">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/hpeak-ui.css">
<link rel="stylesheet" href="app.css?v=20260928121410">
</head>
<body>
<div id="app">

  <!-- ══ 附近(地圖) ══ -->
  <section class="pane on" id="pane-near">
    <div id="map"></div>

    <div class="mapctl" id="mapctl">
      <button id="locBtn" class="iconbtn" aria-label="回到我的位置">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="seg" role="group" aria-label="篩選">
        <button class="segb on" data-filter="free">有空位</button>
        <button class="segb" data-filter="all">全部</button>
      </div>
      <div class="seg" role="group" aria-label="種類">
        <button class="segb on" data-kind="all">全部</button>
        <button class="segb" data-kind="lot">停車場</button>
        <button class="segb" data-kind="street">路邊</button>
      </div>
    </div>

    <div id="stale" class="stale" hidden></div>

    <div id="legend" class="legend">
      <span><i class="lg free"></i>有位</span>
      <span><i class="lg tight"></i>快滿</span>
      <span><i class="lg zero"></i>滿</span>
      <span><i class="lg unk"></i>未知</span>
    </div>

    <div id="pickHint" class="pickhint" hidden>點地圖選擇位置</div>

    <div id="sheet" class="sheet" hidden aria-live="polite">
      <div class="grab"></div>
      <div id="sheetBody"></div>
    </div>

    <div id="listPane" class="listpane peek">
      <div class="sheet-grip" id="grip"><div class="bar"></div></div>
      <div class="listhead">
        <strong id="listTitle">附近車位</strong><span class="cnt" id="listCount"></span>
        <div class="seg small">
          <button class="segb on" data-sort="dist">最近</button>
          <button class="segb" data-sort="price">最便宜</button>
        </div>
      </div>
      <div id="listBody" class="listbody"></div>
    </div>
  </section>

  <!-- ══ 搜尋 ══ -->
  <section class="pane" id="pane-search">
    <div class="pagehead"><h1>搜尋</h1></div>
    <div class="pagebody">
      <input id="q" class="qinput" type="search" placeholder="停車場名稱、路段或行政區" autocomplete="off" enterkeyhint="search">
      <div id="qhint" class="qhint">輸入關鍵字,例如「南崁」「文中路」「機場」</div>
      <div id="qres" class="qres"></div>
    </div>
  </section>

  <!-- ══ 常用 ══ -->
  <section class="pane" id="pane-fav">
    <div class="pagehead"><h1>常用</h1></div>
    <div class="pagebody"><div id="favBody"></div></div>
  </section>

  <!-- ══ 設定 ══ -->
  <section class="pane" id="pane-set">
    <div class="pagehead"><h1>設定</h1></div>
    <div class="pagebody"><div id="setBody"></div></div>
  </section>

  <!-- ══ 底部主選單:DOM 與 class 照抄 jetstream/public/hpeak-tab.js,樣式吃 vendor/hpeak-ui.css ══ -->
  <nav class="hp-tabbar" id="hp-tabbar">
    <button type="button" class="hp-tab-btn hp-active" data-hp="near"><span class="hp-tab-icon">🅿️</span>附近</button>
    <button type="button" class="hp-tab-btn" data-hp="search"><span class="hp-tab-icon">🔍</span>搜尋</button>
    <button type="button" class="hp-tab-btn" data-hp="fav"><span class="hp-tab-icon">⭐</span>常用</button>
    <button type="button" class="hp-tab-btn" data-hp="set"><span class="hp-tab-icon">⚙️</span>設定</button>
    <div class="hp-tab-util">
      <div class="hp-lang-seg" id="hp-lang" data-lang="zh" title="中文 / English">
        <span class="hp-lang-knob"></span>
        <button type="button" class="hp-lang-opt" data-lg="zh">中</button>
        <button type="button" class="hp-lang-opt" data-lg="en">EN</button>
      </div>
      <div class="hp-theme-seg" title="日 / 夜"><span class="hp-theme-knob"></span>
        <button type="button" class="hp-theme-opt" data-th="light" aria-label="日間 Day">☀️</button>
        <button type="button" class="hp-theme-opt" data-th="dark" aria-label="夜間 Night">🌙</button>
      </div>
      <div class="hp-font-wrap">
        <button type="button" class="hp-font-btn" data-fd="1">A+</button>
        <button type="button" class="hp-font-btn" data-fd="-1">A−</button>
      </div>
      <span class="hp-ver" id="hp-ver" role="button" tabindex="0"></span>
    </div>
  </nav>

  <div id="aboutOv" class="overlay" hidden></div>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="app.js?v=20260928121410"></script>
</body>
</html>
