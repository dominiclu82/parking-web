<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>停哪裡</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="app">

  <header id="bar">
    <div class="bar-main">
      <button id="locBtn" class="iconbtn" aria-label="回到我的位置">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="seg" role="group" aria-label="篩選">
        <button class="segb on" data-filter="free">有空位</button>
        <button class="segb" data-filter="all">全部</button>
      </div>
      <div class="seg" role="group" aria-label="種類">
        <button class="segb on" data-kind="all">全部</button>
        <button class="segb" data-kind="lot">停車場</button>
        <button class="segb" data-kind="street">路邊</button>
      </div>
      <button id="listBtn" class="iconbtn" aria-label="清單">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="stale" class="stale" hidden></div>
  </header>

  <div id="map"></div>

  <div id="pickHint" class="pickhint" hidden>點地圖選擇位置</div>

  <div id="sheet" class="sheet" hidden aria-live="polite">
    <div class="grab"></div>
    <div id="sheetBody"></div>
  </div>

  <div id="listPane" class="listpane peek">
    <div class="sheet-grip" id="grip"><div class="bar"></div></div>
    <div class="listhead">
      <strong id="listTitle">附近車位</strong><span class="cnt" id="listCount"></span>
      <div class="seg small">
        <button class="segb on" data-sort="dist">最近</button>
        <button class="segb" data-sort="price">最便宜</button>
      </div>
      <button id="listClose" class="iconbtn" aria-label="關閉">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="listBody" class="listbody"></div>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
